<div class="rounded-2xl border border-amber-300 bg-amber-50 p-5 mt-2"
     role="alert" aria-atomic="true">
  <p class="text-sm text-amber-800">{{ message }}</p>
  {% if error_code %}
    <p class="mt-3 rounded-lg border border-amber-300/70 bg-amber-100/70 px-3 py-2 text-xs text-amber-900">
      Error code
      <code class="font-mono font-semibold tabular-nums">{{ error_code }}</code>
    </p>
  {% endif %}
  {% if action %}
    <p class="mt-3 text-sm text-amber-900">
      <span class="font-semibold">Next step:</span> {{ action }}
    </p>
  {% endif %}
</div>
