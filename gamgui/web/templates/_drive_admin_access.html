<div class="rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-950" role="status">
  <p class="font-medium">{{ result.detail }}</p>
  <p class="mt-1">
    Google Drive opened in the system browser. Use
    <strong>{{ result.admin_email }}</strong>; another signed-in account can still show
    “Request access.”
  </p>
  {% if result.created %}
  <form class="mt-3"
        hx-post="/drive/admin-access/remove"
        hx-target="#drive-action"
        hx-swap="innerHTML"
        hx-confirm="Remove temporary editor access for {{ result.admin_email }}?">
    <input type="hidden" name="email" value="{{ email }}" />
    <input type="hidden" name="file_id" value="{{ file_id }}" />
    <input type="hidden" name="permission_id" value="{{ result.permission_id }}" />
    <button type="submit"
            class="rounded-lg border border-amber-500 bg-brand-white px-3 py-2 font-medium text-amber-950 hover:bg-amber-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-700">
      Remove temporary admin access
    </button>
  </form>
  {% else %}
  <p class="mt-2 text-xs">GamGUI did not create a new permission, so it will not remove an existing one.</p>
  {% endif %}
</div>
