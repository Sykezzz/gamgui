<div class="rounded-xl border border-red-300 bg-red-50 p-4">
  <h5 class="font-medium text-red-900">Transfer ownership of {{ file.name }}?</h5>
  <p class="mt-1 text-sm text-red-800">Current owner: <b>{{ email }}</b><br />New owner: <b>{{ destination }}</b></p>
  <p class="mt-2 text-sm text-red-800">This transfers only file ID <span class="break-all font-mono text-xs">{{ file.id }}</span>. Folder descendants are excluded by the mandatory <code>norecursion</code> command flag.</p>
  <form class="mt-3 space-y-2" hx-post="/drive/ownership/apply" hx-target="#drive-ownership" hx-swap="innerHTML">
    <input type="hidden" name="email" value="{{ email }}" />
    <input type="hidden" name="file_id" value="{{ file.id }}" />
    <input type="hidden" name="destination" value="{{ destination }}" />
    <label class="block text-sm font-medium text-red-900">Type {{ destination }} to confirm
      <input class="mt-1 w-full rounded-lg border border-red-300 bg-brand-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-600" type="email" name="confirmation" autocomplete="off" required />
    </label>
    <label class="flex items-start gap-2 rounded-lg border border-red-300 bg-brand-white p-3 text-sm text-red-950">
      <input class="mt-0.5 rounded border-red-400 text-red-700 focus:ring-red-600" type="checkbox" name="restrict_access" />
      <span>
        <strong>Restrict to the new owner after transfer.</strong>
        Remove every removable direct user, group, domain, and link permission.
        Inherited or policy-controlled access cannot be removed at the file level and
        will be reported as residual access.
      </span>
    </label>
    <button type="submit" class="rounded-lg bg-red-700 px-3 py-2 text-sm font-medium text-white hover:bg-red-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-700 focus-visible:ring-offset-2">Transfer ownership</button>
  </form>
</div>
