{% if ok %}
<div class="rounded-lg border border-emerald-300 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status">{{ message }}</div>
{% else %}
<div class="rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="alert">
  <p>{{ message }}</p>
  {% if details %}<pre class="mt-2 max-h-48 overflow-auto whitespace-pre-wrap text-xs">{{ details }}</pre>{% endif %}
</div>
{% endif %}
