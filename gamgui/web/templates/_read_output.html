{% if output.strip() %}
<div class="rounded-2xl border border-brand-gray/40 bg-brand-white p-3 shadow-sm">
  <p class="mb-2 text-xs text-brand-gray"><code>{{ gam }}</code></p>
  <pre class="whitespace-pre-wrap break-all rounded bg-paper p-2 text-xs text-brand-black">{{ output }}</pre>
  {% if truncated %}<p class="mt-2 text-xs text-brand-gray">Interactive output was truncated to a safe response size. Use Google Sheet export when this command supports it.</p>{% endif %}
</div>
{% else %}
<p class="text-sm text-brand-gray">No output. <code>{{ gam }}</code></p>
{% endif %}
