name: Sync upstream GamGUI

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: district-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: district-main
          fetch-depth: 0
      - name: Build conflict-free integration candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/goetchstone/gamgui.git
          git fetch --no-tags upstream main
          git fetch origin district-main
          if git merge-base --is-ancestor upstream/main origin/district-main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_SHORT="$(git rev-parse --short=12 upstream/main)"
          DISTRICT_SHORT="$(git rev-parse --short=12 origin/district-main)"
          BRANCH="automation/upstream-${UPSTREAM_SHORT}-${DISTRICT_SHORT}"
          PR="$(gh pr list --base district-main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$PR" ]; then
            echo "Resuming existing upstream integration pull request: $PR"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            BRANCH="${BRANCH}-run-${GITHUB_RUN_ID}"
          fi
          if [ -z "$PR" ]; then
            git checkout -B "$BRANCH" origin/district-main
            if ! git merge --no-edit upstream/main; then
              CONFLICTS="$(git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/')"
              git merge --abort
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "held=true" >> "$GITHUB_OUTPUT"
              echo "upstream_short=$UPSTREAM_SHORT" >> "$GITHUB_OUTPUT"
              {
                echo "conflicts<<EOF"
                echo "$CONFLICTS"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "::warning title=Upstream sync safely held::A source conflict requires review; no branch was advanced."
              {
                echo "### Upstream sync safely held"
                echo
                echo "Upstream \`$UPSTREAM_SHORT\` conflicts with \`district-main\` in:"
                echo
                echo "$CONFLICTS"
                echo
                echo "No branch was advanced, and the installed release was not changed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git push origin "HEAD:refs/heads/$BRANCH"
            PR="$(gh pr create --base district-main --head "$BRANCH" \
              --title "chore: integrate upstream ${UPSTREAM_SHORT}" \
              --body "Automated conflict-free integration of goetchstone/gamgui main. CI and exact-SHA post-merge validation remain mandatory.")"
          else
            git fetch --no-tags origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "held=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact-SHA CI and protected merge
        if: steps.candidate.outputs.needed == 'true' && steps.candidate.outputs.held != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/merge_tested_automation_pr.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "${{ steps.candidate.outputs.branch }}" \
            --head-sha "${{ steps.candidate.outputs.head_sha }}" \
            --pull-request "${{ steps.candidate.outputs.pr }}"
      - name: Start exact post-merge validation
        if: steps.candidate.outputs.needed == 'true' && steps.candidate.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: gh workflow run post-merge-validation.yml --ref district-main -f sha="$MERGED_SHA"
      - name: Report blocked upstream integration
        if: steps.candidate.outputs.held == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHORT: ${{ steps.candidate.outputs.upstream_short }}
          CONFLICTS: ${{ steps.candidate.outputs.conflicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Upstream sync blocked"
          BODY="$(printf 'Upstream `%s` conflicts with `district-main` in:\n\n%s\n\nNo branch was advanced. Run: %s' \
            "$UPSTREAM_SHORT" "$CONFLICTS" "$RUN_URL")"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      - name: Report unexpected upstream integration failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Upstream sync blocked"
          BODY="The automated upstream integration failed before validated completion. Nothing was force-synced or installed. Run: $RUN_URL"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
