name: Windows Setup prerelease

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact validated district-main and update-ready SHA
        required: true
        type: string
      release_tag:
        description: Windows prerelease tag
        required: true
        default: v0.0.1-windows.1
        type: string

concurrency:
  group: windows-prerelease-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: verify exact promoted source and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Require the first Windows prerelease contract
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v0.0.1-windows.1"
          test "$(printf '%s' "$EXPECTED_SHA" | grep -Ec '^[0-9a-f]{40}$')" = "1"
          git fetch --no-tags origin \
            district-main:refs/remotes/origin/district-main \
            update-ready:refs/remotes/origin/update-ready
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/district-main)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/update-ready)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing GitHub release." >&2
            exit 1
          fi

  windows-test:
    name: Windows offline suite (py${{ matrix.python }})
    needs: verify-source
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - name: Run complete offline Windows suite
        shell: pwsh
        run: |
          uv sync --frozen --python (Get-Command python).Source --extra dev
          .venv\Scripts\pytest.exe -q

  build-and-exercise:
    name: build and exercise unified Setup
    needs: [verify-source, windows-test]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - name: Sync locked build environment
        shell: pwsh
        run: uv sync --frozen --python (Get-Command python).Source --extra dev --extra desktop --extra build
      - name: Materialize checksum-pinned updater toolchain
        shell: pwsh
        run: .venv\Scripts\python.exe -c "from pathlib import Path; from gamgui.core.windows_update import WindowsToolchain; WindowsToolchain(Path('.ci-toolchain')).ensure()"
      - name: Build both exact-SHA profiles and unified unsigned Setup
        shell: pwsh
        run: |
          .\scripts\build_windows_setup.ps1 `
            -ExpectedSha "${{ inputs.sha }}" `
            -ToolchainBundleDir ".ci-toolchain\windows-local-build-v1\downloads"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release receipts and unsigned boundary
        shell: pwsh
        run: |
          $root = "dist\windows-setup"
          $setup = Join-Path $root "GamGUI-Setup-0.0.1-windows-x86_64.exe"
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root "windows-bootstrap-manifest.json") | ConvertFrom-Json
          if ($manifest.source_sha -ne "${{ inputs.sha }}") { throw "Release manifest SHA mismatch." }
          if ($manifest.setup.signing_status -ne "NotSigned") { throw "Unexpected Setup signing status." }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne "NotSigned") { throw "Setup is not at the documented unsigned boundary." }
          $expected = (Get-Content -Raw -LiteralPath "$setup.sha256").Split()[0]
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $manifest.setup.sha256) { throw "Setup checksum receipt mismatch." }
          if ((Get-Item -LiteralPath $setup).Length -ge 2GB) { throw "Setup exceeds GitHub's asset limit." }
          if (@($manifest.profiles.profile | Sort-Object) -join ',' -ne 'classroom-oneroster,core') { throw "Both profiles were not embedded." }
          $gamVersionOutput = & .venv\Scripts\python.exe -c "from gamgui.core.gam.commands import EXPECTED_GAM_VERSION; print(EXPECTED_GAM_VERSION)"
          $gamVersionExitCode = $LASTEXITCODE
          $expectedGamVersion = ($gamVersionOutput | Out-String).Trim()
          if ($gamVersionExitCode -ne 0 -or $expectedGamVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Repository GAM source pin is invalid." }
          if ([string]$manifest.gam_version -cne $expectedGamVersion) { throw "Bundled GAM pin mismatch." }
      - name: Exercise fail-closed setup, both profiles, signatures, and uninstall
        shell: pwsh
        run: |
          .\scripts\test_windows_setup.ps1 `
            -SetupPath "dist\windows-setup\GamGUI-Setup-0.0.1-windows-x86_64.exe" `
            -ExpectedSha "${{ inputs.sha }}"
      - name: Attest the exact release assets
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/windows-setup/GamGUI-Setup-0.0.1-windows-x86_64.exe
            dist/windows-setup/GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256
            dist/windows-setup/windows-bootstrap-manifest.json
            dist/windows-setup/windows-bootstrap-manifest.json.sha256
      - name: Retain verified prerelease assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-prerelease-${{ inputs.sha }}
          path: |
            dist/windows-setup/GamGUI-Setup-0.0.1-windows-x86_64.exe
            dist/windows-setup/GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256
            dist/windows-setup/windows-bootstrap-manifest.json
            dist/windows-setup/windows-bootstrap-manifest.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: manually approve and publish prerelease
    needs: build-and-exercise
    runs-on: ubuntu-latest
    environment: windows-prerelease
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-prerelease-${{ inputs.sha }}
          path: release-assets
      - name: Recheck hosted publication inputs
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISTRICT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/district-main" --jq .object.sha)"
          READY_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/update-ready" --jq .object.sha)"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$DISTRICT_SHA" = "$EXPECTED_SHA"
          test "$READY_SHA" = "$EXPECTED_SHA"
          test "$TAG_SHA" = "$EXPECTED_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing GitHub release." >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256
          sha256sum --check windows-bootstrap-manifest.json.sha256
      - name: Write plain-language prerelease notes
        shell: bash
        run: |
          CHECKSUM="$(cut -d' ' -f1 release-assets/GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256)"
          cat > release-assets/RELEASE-NOTES.md <<EOF
          GamGUI 0.0.1 Windows Setup Preview

          This prerelease contains one offline Windows 11 x64 installer with both GamGUI profiles. Classroom + OneRoster is recommended and selected by default.

          Important: this Setup executable is unsigned. GitHub hosting does not remove Microsoft SmartScreen warnings, and each unsigned build develops reputation independently. Before running it, compare its SHA-256 checksum:

          \`$CHECKSUM\`

          During the wizard, GamGUI asks before creating a non-exportable local signing identity and trusting its public certificate for the current Windows user. That identity signs the installed application and future local updates. Setup does not contact Google, GAM, Keychain, or tenant services.

          Use More info > Run anyway only after the downloaded checksum matches this release. Uninstall preserves local application data unless you explicitly select Also delete local application data.
          EOF
      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "GamGUI 0.0.1 — Windows Setup Preview" \
            --notes-file release-assets/RELEASE-NOTES.md \
            release-assets/GamGUI-Setup-0.0.1-windows-x86_64.exe \
            release-assets/GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256 \
            release-assets/windows-bootstrap-manifest.json \
            release-assets/windows-bootstrap-manifest.json.sha256

  verify-hosted:
    name: download and install the hosted prerelease
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - name: Download the public GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path hosted-release | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir hosted-release `
            --pattern "GamGUI-Setup-0.0.1-windows-x86_64.exe" `
            --pattern "GamGUI-Setup-0.0.1-windows-x86_64.exe.sha256" `
            --pattern "windows-bootstrap-manifest.json" `
            --pattern "windows-bootstrap-manifest.json.sha256"
      - name: Recheck hosted bytes and unsigned boundary
        shell: pwsh
        run: |
          $root = "hosted-release"
          $setup = Join-Path $root "GamGUI-Setup-0.0.1-windows-x86_64.exe"
          $manifestPath = Join-Path $root "windows-bootstrap-manifest.json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $expectedSetup = (Get-Content -Raw -LiteralPath "$setup.sha256").Split()[0]
          $actualSetup = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedManifest = (Get-Content -Raw -LiteralPath "$manifestPath.sha256").Split()[0]
          $actualManifest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSetup -ne $expectedSetup -or $actualSetup -ne $manifest.setup.sha256) { throw "Hosted Setup checksum mismatch." }
          if ($actualManifest -ne $expectedManifest) { throw "Hosted manifest checksum mismatch." }
          if ($manifest.source_sha -ne "${{ inputs.sha }}") { throw "Hosted manifest SHA mismatch." }
          if ($manifest.setup.signing_status -ne "NotSigned") { throw "Hosted manifest crossed the unsigned boundary." }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne "NotSigned") { throw "Hosted Setup signing status changed." }
      - name: Repeat packaged installation verification from hosted bytes
        shell: pwsh
        run: |
          .\scripts\test_windows_setup.ps1 `
            -SetupPath "hosted-release\GamGUI-Setup-0.0.1-windows-x86_64.exe" `
            -ExpectedSha "${{ inputs.sha }}" `
            -SkipTamperedBootstrap
