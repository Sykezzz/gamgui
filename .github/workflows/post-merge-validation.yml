name: Post-merge validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact district-main commit to validate
        required: true
        type: string

concurrency:
  group: post-merge-update-ready
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-sha:
    name: verify exact SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Reject a moving or malformed input
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$(printf '%s' "$EXPECTED_SHA" | grep -Ec '^[0-9a-f]{40}$')" = "1"
          git fetch origin district-main:refs/remotes/origin/district-main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/district-main)" = "$EXPECTED_SHA"

  test:
    name: validation test (${{ matrix.os }}, py${{ matrix.python }})
    needs: verify-sha
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          uv sync --frozen --python "$(which python)" --extra dev
          .venv/bin/pytest -q

  gam-contracts:
    name: pinned and latest GAM contracts
    needs: verify-sha
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        release: [pinned, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          uv sync --frozen --python "$(which python)" --extra dev
      - name: Fetch tested GAM release
        run: |
          if [ "${{ matrix.release }}" = latest ]; then
            LATEST="$(gh api repos/GAM-team/GAM/releases/latest --jq .tag_name)"
            .venv/bin/python scripts/bump_gam.py --tag "$LATEST"
          else
            ./scripts/fetch_gam.sh
          fi
          .venv/bin/pytest -q tests/test_command_contract.py tests/test_bump_gam.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  updater-and-build:
    name: updater, bundle, and rollback contracts (${{ matrix.profile }})
    needs: verify-sha
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [core, classroom-oneroster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          make setup PYTHON="$(which python)"
          make gam
          .venv/bin/python -m pytest -q tests/test_updater.py tests/test_bump_gam.py
          make app PROFILE="${{ matrix.profile }}"
          dist/GamGUI.app/Contents/MacOS/GamGUI --self-test --json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-ready:
    name: update-ready
    needs: [verify-sha, test, gam-contracts, updater-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Advance authenticated updater ref to the exact validated commit
        env:
          VALIDATED_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          git fetch origin district-main:refs/remotes/origin/district-main
          test "$(git rev-parse origin/district-main)" = "$VALIDATED_SHA"
          git push \
            origin \
            "$VALIDATED_SHA:refs/heads/update-ready"

  report-failure:
    name: report validation failure
    if: >-
      ${{ always() && (
        needs.verify-sha.result != 'success' ||
        needs.test.result != 'success' ||
        needs.gam-contracts.result != 'success' ||
        needs.updater-and-build.result != 'success'
      ) }}
    needs: [verify-sha, test, gam-contracts, updater-and-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or update the blocked-update issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Automatic update blocked"
          BODY="Validation failed for \`$SHA\`. The installed app remains unchanged. Run: $RUN_URL"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
