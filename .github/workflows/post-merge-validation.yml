name: Post-merge validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact district-main commit to validate
        required: true
        type: string

concurrency:
  group: post-merge-update-ready
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-sha:
    name: verify exact SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Reject a moving or malformed input
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$(printf '%s' "$EXPECTED_SHA" | grep -Ec '^[0-9a-f]{40}$')" = "1"
          git fetch origin district-main:refs/remotes/origin/district-main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/district-main)" = "$EXPECTED_SHA"

  test:
    name: validation test (${{ matrix.os }}, py${{ matrix.python }})
    needs: verify-sha
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          uv sync --frozen --python "$(which python)" --extra dev
          .venv/bin/pytest -q

  windows-test:
    name: validation Windows test (py${{ matrix.python }})
    needs: verify-sha
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - shell: pwsh
        run: |
          uv sync --frozen --python (Get-Command python).Source --extra dev
          .venv\Scripts\pytest.exe -q

  gam-contracts:
    name: pinned and latest GAM contracts
    needs: verify-sha
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        release: [pinned, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          uv sync --frozen --python "$(which python)" --extra dev
      - name: Fetch tested GAM release
        run: |
          if [ "${{ matrix.release }}" = latest ]; then
            LATEST="$(gh api repos/GAM-team/GAM/releases/latest --jq .tag_name)"
            .venv/bin/python scripts/bump_gam.py --tag "$LATEST"
          else
            ./scripts/fetch_gam.sh
          fi
          .venv/bin/pytest -q tests/test_command_contract.py tests/test_bump_gam.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  updater-and-build:
    name: updater, bundle, and rollback contracts (${{ matrix.profile }})
    needs: verify-sha
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [core, classroom-oneroster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - run: |
          make setup PYTHON="$(which python)"
          make gam
          .venv/bin/python -m pytest -q tests/test_updater.py tests/test_bump_gam.py
          make app PROFILE="${{ matrix.profile }}"
          dist/GamGUI.app/Contents/MacOS/GamGUI --self-test --json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-updater-and-build:
    name: Windows updater, bootstrap, and rollback contracts (${{ matrix.profile }})
    needs: verify-sha
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [core, classroom-oneroster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"
      - name: Sync locked build environment
        shell: pwsh
        run: uv sync --frozen --python (Get-Command python).Source --extra dev --extra desktop --extra build
      - name: Exercise Windows activation and rollback contracts
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q tests/test_windows_update.py tests/test_updater.py tests/test_updater_profiles.py tests/test_app_window.py tests/test_activity.py
      - name: Materialize checksum-pinned bootstrap toolchain
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -c "from pathlib import Path; from gamgui.core.windows_update import WindowsToolchain; WindowsToolchain(Path('.ci-toolchain')).ensure()"
      - name: Enroll ephemeral runner signing identity
        shell: pwsh
        run: |
          $identity = & .\scripts\windows_local_signing.ps1 -Action Enroll -CiEphemeralCertificate | ConvertFrom-Json
          "WINDOWS_SIGNER_SHA=$($identity.certificate_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build exact-SHA validation-only bootstrap
        shell: pwsh
        run: |
          .\scripts\build_windows_release.ps1 -Profile "${{ matrix.profile }}" -ExpectedSha "${{ inputs.sha }}" -CertificateSha256 $env:WINDOWS_SIGNER_SHA -CiEphemeralCertificate -ToolchainBundleDir ".ci-toolchain\windows-local-build-v1\downloads" -Bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload validation-only bootstrap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-only-windows-bootstrap-${{ matrix.profile }}-${{ inputs.sha }}
          path: |
            dist/GamGUI-0.0.1-windows-x86_64-${{ matrix.profile }}-bootstrap-*.zip
            dist/GamGUI-0.0.1-windows-x86_64-${{ matrix.profile }}-bootstrap-*.zip.sha256
          if-no-files-found: error
      - name: Remove ephemeral runner signing identity
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNER_SHA) {
            .\scripts\windows_local_signing.ps1 -Action Remove -CertificateSha256 $env:WINDOWS_SIGNER_SHA
          }

  update-ready:
    name: update-ready
    needs: [verify-sha, test, windows-test, gam-contracts, updater-and-build, windows-updater-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Advance authenticated updater ref to the exact validated commit
        env:
          VALIDATED_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          git fetch --no-tags origin \
            district-main:refs/remotes/origin/district-main \
            update-ready:refs/remotes/origin/update-ready
          test "$(git rev-parse origin/district-main)" = "$VALIDATED_SHA"
          READY_SHA="$(git rev-parse origin/update-ready)"
          git merge-base --is-ancestor "$READY_SHA" "$VALIDATED_SHA"
          git push \
            origin \
            "$VALIDATED_SHA:refs/heads/update-ready"

  report-failure:
    name: report validation failure
    if: >-
      ${{ always() && (
        needs.verify-sha.result != 'success' ||
        needs.test.result != 'success' ||
        needs.windows-test.result != 'success' ||
        needs.gam-contracts.result != 'success' ||
        needs.updater-and-build.result != 'success' ||
        needs.windows-updater-and-build.result != 'success'
      ) }}
    needs: [verify-sha, test, windows-test, gam-contracts, updater-and-build, windows-updater-and-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or update the blocked-update issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Automatic update blocked"
          BODY="Validation failed for \`$SHA\`. The installed app remains unchanged. Run: $RUN_URL"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
